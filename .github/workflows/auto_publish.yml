name: 🤖 Auto Publish & Zero-Residue Cleanup

on:
  schedule:
    # Har 30 minute mein check karta hai naye approved videos ke liye
    - cron: '*/30 * * * *'
  workflow_dispatch: # GitHub UI se manually bhi trigger kar sakte hain

jobs:
  publish-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 2GB video download + upload ke liye zyada time

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💽 Free Up Disk Space (for 2GB video handling)
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          # Remove unnecessary large packages to free up ~20GB space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "=== Disk Space After Cleanup ==="
          df -h

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests langchain-openai browser-use
          python -m playwright install --with-deps chromium

      - name: 🚀 Run Auto Publisher (Social Upload & Cleanup)
        env:
          CLOUDINARY_CLOUD_NAME: "dqm62mqbs"
          CLOUDINARY_API_KEY: "974397986324117"
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python auto_publisher.py

      - name: ✅ Done - Report Status
        if: always()
        run: |
          echo "Auto-publisher run completed at $(date -u)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "=== Final Disk Space ==="
          df -h
