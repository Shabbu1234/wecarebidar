name: Deploy static frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # We can upload the current workspace directory directly as it contains index.html, admin.html, styles.css, app.js, admin.js
      # Exclude non-production configurations like SQL setups and workflows from public site hosting
      - name: Package Assets
        run: |
          mkdir dist
          cp index.html dist/
          cp admin.html dist/
          cp auth.html dist/
          cp styles.css dist/
          cp app.js dist/
          cp admin.js dist/
          cp auth.js dist/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
