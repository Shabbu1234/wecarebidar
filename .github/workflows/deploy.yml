name: 🌐 Deploy WeCareBidar to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Manual trigger bhi allowed hai

# GitHub Pages ke liye permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Ek waqt mein sirf ek deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Package Frontend Assets
        run: |
          mkdir -p dist
          
          # HTML files copy karo
          cp *.html dist/ 2>/dev/null || true
          
          # JavaScript files copy karo
          cp *.js dist/ 2>/dev/null || true
          
          # CSS files copy karo
          cp *.css dist/ 2>/dev/null || true
          
          # JSON config files copy karo (env nahi)
          cp package.json dist/ 2>/dev/null || true
          cp antgvity_workflow.json dist/ 2>/dev/null || true
          
          echo "✅ Files packaged successfully:"
          ls -la dist/

      - name: 🚀 Upload Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 📣 Deployment Complete
        run: |
          echo "✅ WeCareBidar deployed successfully!"
          echo "🌐 Live URL: ${{ steps.deployment.outputs.page_url }}"
